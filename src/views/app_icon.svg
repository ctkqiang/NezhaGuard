<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd6e8"/>
      <stop offset="50%" stop-color="#e8d0f8"/>
      <stop offset="100%" stop-color="#ffd6e8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f060a0"/>
      <stop offset="50%" stop-color="#c888f0"/>
      <stop offset="100%" stop-color="#30c8a0"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1028"/>
      <stop offset="100%" stop-color="#120818"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f060a0"/>
      <stop offset="50%" stop-color="#d090e8"/>
      <stop offset="100%" stop-color="#30c8a0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#c06090" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- rounded background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- decorative soft circles -->
  <circle cx="160" cy="140" r="80" fill="#ffffff" opacity="0.3"/>
  <circle cx="380" cy="400" r="100" fill="#ffffff" opacity="0.25"/>
  <circle cx="400" cy="120" r="50" fill="#ffffff" opacity="0.2"/>

  <!-- shield shape -->
  <path d="M256 72 L378 140 L378 268 C378 388 314 448 256 472 C198 448 134 388 134 268 L134 140 Z"
        fill="url(#shieldGrad)" filter="url(#softShadow)" stroke="url(#accentGrad)" stroke-width="2.5"/>

  <!-- inner decorative ring -->
  <circle cx="256" cy="236" r="78" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.5"/>
  <circle cx="256" cy="236" r="68" fill="none" stroke="url(#accentGrad)" stroke-width="1" opacity="0.25"/>

  <!-- cute star decorations -->
  <g fill="#fff" opacity="0.9">
    <path d="M160 240 L164 232 L168 240 L176 244 L168 248 L164 256 L160 248 L152 244 Z" fill="#f060a0" opacity="0.8"/>
    <path d="M352 240 L348 232 L344 240 L336 244 L344 248 L348 256 L352 248 L360 244 Z" fill="#30c8a0" opacity="0.8"/>
  </g>

  <!-- small decorative dots -->
  <circle cx="170" cy="190" r="3" fill="#f8a0c8" opacity="0.8"/>
  <circle cx="342" cy="190" r="3" fill="#f8a0c8" opacity="0.8"/>
  <circle cx="210" cy="330" r="2.5" fill="#70e0c8" opacity="0.7"/>
  <circle cx="302" cy="330" r="2.5" fill="#70e0c8" opacity="0.7"/>

  <!-- main text: 哪吒 -->
  <text x="256" y="256" text-anchor="middle"
        font-family="PingFang SC,Hiragino Sans GB,STSong,serif"
        font-size="54" font-weight="900"
        fill="url(#textGrad)">哪吒</text>

  <!-- subtitle -->
  <text x="256" y="320" text-anchor="middle"
        font-family="PingFang SC,Hiragino Sans GB,STSong,serif"
        font-size="17" font-weight="700"
        fill="#f080b0" opacity="0.9">网络安全</text>

  <!-- tiny hearts at corners -->
  <g fill="#f080b0" opacity="0.5">
    <path d="M90 70 C86 65 80 66 78 70 C76 74 78 78 90 84 C102 78 104 74 102 70 C100 66 94 65 90 70 Z"/>
    <path d="M422 70 C418 65 412 66 410 70 C408 74 410 78 422 84 C434 78 436 74 434 70 C432 66 426 65 422 70 Z"/>
    <path d="M90 442 C86 437 80 438 78 442 C76 446 78 450 90 456 C102 450 104 446 102 442 C100 438 94 437 90 442 Z"/>
    <path d="M422 442 C418 437 412 438 410 442 C408 446 410 450 422 456 C434 450 436 446 434 442 C432 438 426 437 422 442 Z"/>
  </g>
</svg>
