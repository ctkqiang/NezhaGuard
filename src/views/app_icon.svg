<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8b0000"/>
      <stop offset="50%" stop-color="#c41e3a"/>
      <stop offset="100%" stop-color="#e8384f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a017"/>
      <stop offset="50%" stop-color="#f0c75e"/>
      <stop offset="100%" stop-color="#d4a017"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1a0000"/>
      <stop offset="100%" stop-color="#2a0505"/>
    </linearGradient>
  </defs>
  <!-- background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- outer ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.6"/>
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.3"/>
  <!-- inner shield shape -->
  <path d="M256 60 L386 140 L386 280 C386 386 322 448 256 476 C190 448 126 386 126 280 L126 140 Z" fill="url(#inner)" stroke="url(#gold)" stroke-width="3"/>
  <!-- flame ornaments - left -->
  <path d="M150 260 Q140 230 150 200 Q155 215 160 200 Q165 225 155 260" fill="#e8384f" opacity="0.7"/>
  <path d="M140 300 Q128 270 140 240 Q146 258 152 240 Q158 268 148 300" fill="#f0c75e" opacity="0.5"/>
  <!-- flame ornaments - right -->
  <path d="M362 260 Q372 230 362 200 Q357 215 352 200 Q347 225 357 260" fill="#e8384f" opacity="0.7"/>
  <path d="M372 300 Q384 270 372 240 Q366 258 360 240 Q354 268 364 300" fill="#f0c75e" opacity="0.5"/>
  <!-- central circle -->
  <circle cx="256" cy="240" r="68" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity="0.8"/>
  <circle cx="256" cy="240" r="58" fill="#1a0000" opacity="0.3"/>
  <!-- 哪吒 text -->
  <text x="256" y="262" text-anchor="middle" font-family="PingFang SC,STSong,SimSun,serif" font-size="52" font-weight="900" fill="url(#gold)">哪吒</text>
  <!-- 网安 small text -->
  <text x="256" y="340" text-anchor="middle" font-family="PingFang SC,STSong,SimSun,serif" font-size="20" font-weight="700" fill="#f0c75e" opacity="0.85">网络安全</text>
  <!-- decorative dots -->
  <circle cx="256" cy="164" r="3" fill="#f0c75e" opacity="0.9"/>
  <circle cx="256" cy="320" r="2" fill="#f0c75e" opacity="0.6"/>
  <circle cx="200" cy="200" r="2" fill="#f0c75e" opacity="0.5"/>
  <circle cx="312" cy="200" r="2" fill="#f0c75e" opacity="0.5"/>
  <!-- corner ornaments -->
  <circle cx="88" cy="88" r="6" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.5"/>
  <circle cx="424" cy="88" r="6" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.5"/>
  <circle cx="88" cy="424" r="6" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.5"/>
  <circle cx="424" cy="424" r="6" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.5"/>
</svg>
