# ============================================================
# NezhaGuard — 应用监控配置
# ============================================================
#
# 格式: 名称 端口 [日志路径...]
#   - 名称: 应用名称（用于日志显示）
#   - 端口: 监听端口（用于检测应用是否在线）
#   - 日志路径: 可选，应用日志文件路径（用于实时显示应用日志）
#
# 仅端口监控（无日志文件）:
#   Express 5000
#   Gin 7000
#
# 端口 + 日志文件监控:
#   Spring-8000 8000 /var/log/spring8000/app.log
#
# 注释行以 # 开头
# ============================================================
