# NezhaGuard 告警通知配置
# 格式:
#   channel=webhook_url    — 配置通知渠道
#   rule: 关键词 -> 渠道1,渠道2  — 触发规则
#
# 支持的渠道: slack, discord, dingtalk, feishu, wechat, email, local

# --- 渠道配置 (填入你自己的 webhook URL) ---
#slack=https://hooks.slack.com/services/TXXXXX/BXXXXX/xxxxxxxxxxxx
#discord=https://discord.com/api/webhooks/xxxxx/xxxxxxxxxxxx
#dingtalk=https://oapi.dingtalk.com/robot/send?access_token=xxxxxxxxxxxx
#feishu=https://open.feishu.cn/open-apis/bot/v2/hook/xxxxxxxxxxxx
#wechat=https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxxxxxxxxxxx
#email=admin@example.com
local=true

# --- 触发规则 ---
# rule: 关键词1,关键词2 -> 渠道1,渠道2
rule: sql,注入,SQLi -> local
rule: brute,暴力,爆破,ssh -> local
rule: 端口扫描,PortScan,扫描 -> local
rule: xss,XSS,跨站 -> local
rule: webshell,木马,后门 -> local
rule: log4j,Log4j,JNDI -> local
rule: critical,致命,CRIT -> local
