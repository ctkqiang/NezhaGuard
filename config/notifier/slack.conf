# ============================================================
# NezhaGuard — Slack 通知配置
# ============================================================
#
# webhook:    Slack Incoming Webhook URL
#             获取方式: https://api.slack.com/messaging/webhooks
#             格式: https://hooks.slack.com/services/TXXXXX/BXXXXX/xxxxxxxxxxxx
#
# enabled:    是否启用 (true 或 false)
#
# keywords:   触发关键词（逗号分隔，大小写不敏感）
#             当告警内容包含任一关键词时触发通知
#             示例: sql,注入,暴力,端口扫描,webshell
#
# min_severity: 最低告警级别 — trace, debug, info, warn, error, critical
#               只有 >= 此级别的告警才会触发
# ============================================================

webhook=https://hooks.slack.com/services/YOUR/WORKSPACE/TOKEN
enabled=false
keywords=sql,注入,暴力,brute,端口扫描,PortScan,xss,木马,后门,log4j,critical,致命
min_severity=warn
