# ============================================================
# NezhaGuard — 飞书 通知配置
# ============================================================
#
# webhook:    飞书群机器人 Webhook URL
#             获取方式: 群设置 → 群机器人 → 添加机器人 → 自定义机器人
#             格式: https://open.feishu.cn/open-apis/bot/v2/hook/HOOK_ID
#             注意: 需要签名校验的话请在 URL 后加上 &secret=xxx
#
# enabled:    是否启用 (true 或 false)
#
# keywords:   触发关键词（逗号分隔，大小写不敏感）
#
# min_severity: 最低告警级别 — trace, debug, info, warn, error, critical
# ============================================================

webhook=https://open.feishu.cn/open-apis/bot/v2/hook/YOUR_HOOK_ID
enabled=false
keywords=sql,注入,暴力,端口扫描,webshell,木马,critical,致命
min_severity=warn
