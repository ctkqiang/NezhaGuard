# ============================================================
# NezhaGuard — Discord 通知配置
# ============================================================
#
# webhook:    Discord Webhook URL
#             获取方式: 服务器设置 → 整合 → Webhooks → 创建 Webhook
#             格式: https://discord.com/api/webhooks/CHANNEL/TOKEN
#
# enabled:    是否启用 (true 或 false)
#
# keywords:   触发关键词（逗号分隔，大小写不敏感）
#
# min_severity: 最低告警级别 — trace, debug, info, warn, error, critical
# ============================================================

webhook=https://discord.com/api/webhooks/YOUR/CHANNEL_TOKEN
enabled=false
keywords=sql,注入,暴力,端口扫描,xss,webshell,木马,critical
min_severity=warn
