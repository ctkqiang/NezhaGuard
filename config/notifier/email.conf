# ============================================================
# NezhaGuard — 邮件 通知配置
# ============================================================
#
# webhook:    接收告警的邮箱地址
#             格式: admin@example.com
#             使用系统 mail 命令发送 (需先配置 sendmail/postfix)
#
# enabled:    是否启用 (true 或 false)
#
# keywords:   触发关键词（逗号分隔，大小写不敏感）
#             邮件通知建议只用于 critical 级别告警
#
# min_severity: 最低告警级别 — trace, debug, info, warn, error, critical
#              建议设为 critical，仅发送最严重的告警
# ============================================================

webhook=admin@example.com
enabled=false
keywords=critical,致命,隔离,quarantine,阻断,CRIT
min_severity=critical
