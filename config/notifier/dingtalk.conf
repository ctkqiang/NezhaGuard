# ============================================================
# NezhaGuard — 钉钉 通知配置
# ============================================================
#
# webhook:    钉钉群机器人 Webhook URL
#             获取方式: 群设置 → 智能群助手 → 添加机器人 → 自定义
#             格式: https://oapi.dingtalk.com/robot/send?access_token=TOKEN
#             注意: 钉钉需要设置关键词或签名验证
#
# enabled:    是否启用 (true 或 false)
#
# keywords:   触发关键词（逗号分隔，大小写不敏感）
#
# min_severity: 最低告警级别 — trace, debug, info, warn, error, critical
# ============================================================

webhook=https://oapi.dingtalk.com/robot/send?access_token=YOUR_ACCESS_TOKEN
enabled=false
keywords=sql,注入,暴力,端口扫描,webshell,木马,critical,致命
min_severity=warn
