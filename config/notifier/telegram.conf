# ============================================================
# NezhaGuard — Telegram 通知配置
# ============================================================
#
# webhook:    Bot Token (从 @BotFather 获取)
#             格式: 123456:ABC-DEF1234ghijkl
#
# chat_id:   目标 Chat/Channel ID
#             获取方式: 将 @getidsbot 拉入群后发送 /id
#
# enabled:    是否启用 (true 或 false)
#
# keywords:   触发关键词（逗号分隔，大小写不敏感）
#
# min_severity: 最低告警级别 — trace, debug, info, warn, error, critical
# ============================================================

webhook=123456:ABC-DEF1234ghijkl
chat_id=-1001234567890
enabled=false
keywords=sql,注入,暴力,端口扫描,xss,webshell,木马,critical,致命
min_severity=warn
