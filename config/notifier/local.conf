# ============================================================
# NezhaGuard — 本地桌面通知 配置
# ============================================================
#
# 无需 webhook — macOS 使用系统通知中心，Linux 使用 notify-send
#
# enabled:    是否启用 (true 或 false)
#
# keywords:   触发关键词（逗号分隔，大小写不敏感）
#             建议覆盖所有攻击类型，因为本地通知无第三方依赖
#
# min_severity: 最低告警级别 — trace, debug, info, warn, error, critical
#              建议设为 warn，及时感知安全事件
# ============================================================

enabled=true
keywords=sql,注入,SQLi,暴力,brute,SSH,爆破,端口扫描,PortScan,扫描,xss,XSS,webshell,木马,后门,log4j,Log4j,JNDI,critical,CRIT,致命,隔离,quarantine,阻断
min_severity=warn
