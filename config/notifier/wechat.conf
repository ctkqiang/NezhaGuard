# ============================================================
# NezhaGuard — 企业微信 通知配置
# ============================================================
#
# webhook:    企业微信群机器人 Webhook URL
#             获取方式: 群设置 → 群机器人 → 添加机器人
#             格式: https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=KEY
#
# enabled:    是否启用 (true 或 false)
#
# keywords:   触发关键词（逗号分隔，大小写不敏感）
#
# min_severity: 最低告警级别 — trace, debug, info, warn, error, critical
# ============================================================

webhook=https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=YOUR_KEY
enabled=false
keywords=sql,注入,暴力,端口扫描,critical,致命
min_severity=warn
