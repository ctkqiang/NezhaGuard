apiVersion: v1
kind: ServiceAccount
metadata:
  name: nezhaguard
  namespace: nezhaguard
  labels:
    app: nezhaguard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nezhaguard
  labels:
    app: nezhaguard
rules:
  - apiGroups: [""]
    resources: [nodes, pods, services, endpoints]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes/proxy]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nezhaguard
  labels:
    app: nezhaguard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nezhaguard
subjects:
  - kind: ServiceAccount
    name: nezhaguard
    namespace: nezhaguard
