# 哪吒网络安全 SIEM — 镜像同步
# 推送 main 分支时自动同步到 Gitee (码云) 与 GitCode
name: 国内镜像同步

on:
  push:
    branches: [main]

jobs:
  # ============================================================
  # 同步到 Gitee (码云)
  # ============================================================
  sync-gitee:
    name: 同步到 Gitee
    runs-on: ubuntu-latest
    if: ${{ vars.GITEE_REPO_URL != '' || secrets.GITEE_TOKEN != '' }}
    steps:
      - name: 检出代码（完整历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 推送到 Gitee
        run: |
          REPO_URL="${{ vars.GITEE_REPO_URL }}"
          if [ -z "$REPO_URL" ]; then
            REPO_URL="https://oauth2:${{ secrets.GITEE_TOKEN }}@gitee.com/${{ github.repository }}.git"
          fi
          git push --force "$REPO_URL" main:main
          git push --force "$REPO_URL" --tags
        shell: bash

  # ============================================================
  # 同步到 GitCode
  # ============================================================
  sync-gitcode:
    name: 同步到 GitCode
    runs-on: ubuntu-latest
    if: ${{ vars.GITCODE_REPO_URL != '' || secrets.GITCODE_TOKEN != '' }}
    steps:
      - name: 检出代码（完整历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 推送到 GitCode
        run: |
          REPO_URL="${{ vars.GITCODE_REPO_URL }}"
          if [ -z "$REPO_URL" ]; then
            REPO_URL="https://oauth2:${{ secrets.GITCODE_TOKEN }}@gitcode.com/${{ github.repository }}.git"
          fi
          git push --force "$REPO_URL" main:main
          git push --force "$REPO_URL" --tags
        shell: bash