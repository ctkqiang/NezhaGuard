name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ═══════════════════════════════════════════════════════════════
  # macOS · .pkg
  # ═══════════════════════════════════════════════════════════════
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt6, pcap & sqlite3
        run: brew install qt@6 libpcap sqlite3

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=/opt/homebrew/opt/qt@6
          -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt frameworks
        run: |
          macdeployqt build/NezhaGuard.app -verbose=1 -always-overwrite
          mkdir -p build/NezhaGuard.app/Contents/Resources/{rules,config}
          cp -R rules/ build/NezhaGuard.app/Contents/Resources/rules/
          cp -R config/ build/NezhaGuard.app/Contents/Resources/config/

      - name: Import Developer ID cert
        id: cert
        env:
          DEV_CERT_B64: ${{ secrets.APPLE_DEVELOPER_CERT_B64 }}
          DEV_CERT_PASS: ${{ secrets.APPLE_DEVELOPER_CERT_PASS }}
          KEYCHAIN_PASS: ${{ secrets.APPLE_KEYCHAIN_PASS }}
        if: env.DEV_CERT_B64 != ''
        run: |
          echo "$DEV_CERT_B64" | base64 -d > /tmp/dev_id.p12
          security create-keychain -p "$KEYCHAIN_PASS" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASS" build.keychain
          security import /tmp/dev_id.p12 -k build.keychain -P "$DEV_CERT_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" build.keychain
          rm /tmp/dev_id.p12
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Sign .app
        if: steps.cert.outputs.signed == 'true'
        run: |
          codesign --deep --force --verify --verbose \
            --options runtime --timestamp \
            --sign "Developer ID Application" \
            build/NezhaGuard.app
          codesign --verify --verbose build/NezhaGuard.app

      - name: Sign .app (ad-hoc fallback)
        if: steps.cert.outputs.signed != 'true'
        run: |
          codesign --deep --force --verify --verbose \
            --sign - build/NezhaGuard.app

      - name: Create .pkg (signed)
        if: steps.cert.outputs.signed == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          pkgbuild --component build/NezhaGuard.app \
            --install-location /Applications \
            --identifier com.nezhaguard.siem \
            --version "$VERSION" \
            --sign "Developer ID Installer" \
            "NezhaGuard-${VERSION}-macOS-arm64.pkg"

      - name: Create .pkg (unsigned)
        if: steps.cert.outputs.signed != 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          pkgbuild --component build/NezhaGuard.app \
            --install-location /Applications \
            --identifier com.nezhaguard.siem \
            --version "$VERSION" \
            "NezhaGuard-${VERSION}-macOS-arm64.pkg"

      - name: Notarize .pkg
        if: steps.cert.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARY_USER }}
          APPLE_PASS: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit NezhaGuard-*.pkg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASS" \
            --team-id "$APPLE_TEAM" \
            --wait
          xcrun stapler staple NezhaGuard-*.pkg

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain build.keychain || true

      - name: Upload .pkg
        uses: softprops/action-gh-release@v2
        with:
          files: NezhaGuard-*.pkg

  # ═══════════════════════════════════════════════════════════════
  # Windows · .exe (zipped)
  # ═══════════════════════════════════════════════════════════════
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt6 (aqtinstall)
        shell: bash
        run: |
          pip install aqtinstall==3.2.1
          aqt install-qt windows desktop 6.7.2 win64_msvc2022_64
          QT6_DIR="${GITHUB_WORKSPACE}/6.7.2/msvc2022_64"
          echo "Qt6_DIR=${QT6_DIR}" >> "$GITHUB_ENV"
          echo "${QT6_DIR}/bin" >> "$GITHUB_PATH"

      - name: Install Npcap SDK
        shell: bash
        run: |
          curl -fsSL -o npcap-sdk.zip https://npcap.com/dist/npcap-sdk-1.79.zip
          7z x npcap-sdk.zip -onpcap-sdk

      - name: Build sqlite3 lib
        shell: cmd
        run: |
          curl -fsSL -o sqlite.zip https://sqlite.org/2025/sqlite-amalgamation-3490100.zip
          7z x sqlite.zip -osqlite-src
          cl /c /O2 /MD sqlite-src\sqlite3.c /Fo:sqlite-src\sqlite3.obj
          lib /OUT:sqlite-src\sqlite3.lib sqlite-src\sqlite3.obj

      - name: Configure
        shell: bash
        run: >
          cmake -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"
          -DPCAP_INCLUDE_DIR="${{ github.workspace }}/npcap-sdk/Include"
          -DPCAP_LIB="${{ github.workspace }}/npcap-sdk/Lib/x64/wpcap.lib"
          -DSQLITE3_INCLUDE_DIR="${{ github.workspace }}/sqlite-src"
          -DSQLITE3_LIB="${{ github.workspace }}/sqlite-src/sqlite3.lib"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt DLLs
        shell: cmd
        run: |
          windeployqt build\Release\NezhaGuard.exe --verbose=1 --no-translations
          mkdir build\Release\rules build\Release\config
          xcopy /E /I rules build\Release\rules
          xcopy /E /I config build\Release\config

      - name: Package (zip)
        shell: bash
        run: |
          cd build/Release
          7z a "../../NezhaGuard-${GITHUB_REF_NAME}-Windows-x64.zip" *

      - name: Upload .zip
        uses: softprops/action-gh-release@v2
        with:
          files: NezhaGuard-*.zip
